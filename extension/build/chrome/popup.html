<!doctype html><html dir="rtl" lang="fa"><head><meta charset="utf-8"><title>تخفیف‌سنج</title>
<style>body{width:250px;font-family:Vazirmatn,"Noto Sans Arabic",Tahoma,system-ui,"Segoe UI",sans-serif;background:#0e1014;color:#f3f4f6;margin:0;padding:16px}
